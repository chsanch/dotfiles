# Ergonomic tmux defaults for daily terminal-heavy work.

##### General behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g history-limit 100000
set -g escape-time 0
set -g repeat-time 300
set -g set-clipboard on
set -g allow-passthrough on

##### Prefix and reloading
set -g prefix C-b
bind C-b send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

##### Window and pane indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

##### Splits open in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

##### Fast pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Quick window movement
bind -r C-h previous-window
bind -r C-l next-window

##### Mouse support
set -g mouse on

##### Copy mode with vim keys
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

##### Session ergonomics
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 80
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g message-style "bg=#1f2335,fg=#c0caf5"
set -g message-command-style "bg=#1f2335,fg=#7aa2f7"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status-left "#[fg=#7aa2f7,bold]#S "
set -g status-right "#[fg=#a9b1d6]%H:%M #[fg=#565f89]| #[fg=#7dcfff]#(whoami)#[fg=#565f89]@#[fg=#7aa2f7]#H "

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1f2335,bold] #I:#W "
setw -g window-status-separator ""

##### Reduce visual noise
set -g visual-bell off
set -g bell-action none
set -g display-panes-time 800
set -g display-time 1500

##### Better defaults for new windows
bind c new-window -c "#{pane_current_path}"
